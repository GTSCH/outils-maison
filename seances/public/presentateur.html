<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Présentateur</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/polices.css">
<link rel="stylesheet" href="/css/seances.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr auto; background: #141A1E; color: #E6EEEA; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #2D3B3A; flex-wrap: wrap; }
  header h1 { font-size: 18px; flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { background: #1E292A; color: #E6EEEA; border-color: #40524F; }
  .btn:hover { background: #263334; }
  .btn.actif { background: #F2B21B; color: #141A1E; border-color: #F2B21B; }
  .btn.primaire { background: #2350B8; border-color: #2350B8; }
  #chrono { font: 700 26px/1 var(--font-display); font-variant-numeric: tabular-nums; cursor: pointer; padding: 6px 10px; border-radius: 6px; background: #1E292A; }
  #chrono.pause { color: #F2B21B; }
  #heure { font: 600 20px var(--font-display); color: #9AAAA5; }
  main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); gap: 16px; padding: 16px; min-height: 0; }
  .col { display: grid; gap: 12px; min-height: 0; }
  .col-g { grid-template-rows: 1fr auto; }
  .col-d { grid-template-rows: auto auto 1fr; }
  .cadre { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  #courante { min-height: 0; }
  #suivante { aspect-ratio: 16 / 9; opacity: .92; }
  .fin { color: #9AAAA5; display: grid; place-items: center; height: 100%; font-size: 20px; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .nav .btn { min-width: 120px; font-size: 18px; }
  #num { font: 700 20px var(--font-display); min-width: 90px; text-align: center; }
  .etiquette { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #9AAAA5; display: flex; justify-content: space-between; align-items: center; }
  #notes { overflow: auto; background: #1E292A; border-radius: 8px; padding: 16px 18px; line-height: 1.45; min-height: 0; }
  #notes .puces { padding-left: 1.2em; margin: .3em 0; }
  #notes p + p { margin-top: .6em; }
  .faible { color: #74837F; }
  #mainlevee { background: #2C2410; border: 1px solid #F2B21B; border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
  #mainlevee form { display: flex; gap: 8px; }
  #mainlevee input { font: 700 22px var(--font-display); letter-spacing: .12em; text-align: center; background: #141A1E; color: #fff; border-color: #F2B21B; }
  footer#bande { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 12px; border-top: 1px solid #2D3B3A; }
  .vign { flex: none; max-width: 220px; padding: 6px 10px; border: 1px solid #40524F; border-radius: 6px; background: #1E292A; color: #C9D4D0; font: 13px/1.3 var(--font-ui); text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vign.actif { background: #2350B8; color: #fff; border-color: #2350B8; }
  .vide-plein { padding: 40px; display: grid; gap: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="titre">Séance</h1>
  <span id="chrono" title="Cliquer pour mettre en pause">00:00</span>
  <button class="btn petit" id="b-chrono-zero" title="Remettre le chronomètre à zéro">↺</button>
  <span id="heure"></span>
  <button class="btn primaire" id="b-proj">Ouvrir la projection</button>
  <button class="btn" id="b-qr" title="Touche Q">QR de la séance</button>
  <button class="btn" id="b-noir" title="Touche B">Écran noir</button>
  <button class="btn petit" id="b-zero" title="Pour un nouveau groupe">Nouveau groupe</button>
  <a class="btn petit" id="b-editer">Modifier</a>
</header>
<main>
  <section class="col col-g">
    <div class="cadre" id="courante"></div>
    <div class="nav">
      <button class="btn" id="b-prec">◀ Précédente</button>
      <span id="num">1 / 1</span>
      <button class="btn" id="b-suiv">Suivante ▶</button>
    </div>
  </section>
  <section class="col col-d">
    <div>
      <p class="etiquette">Ensuite</p>
      <div class="cadre" id="suivante"></div>
    </div>
    <div id="mainlevee" hidden>
      <p class="etiquette">Main levée</p>
      <form id="ml-form">
        <input id="ml-code" inputmode="numeric" maxlength="7" placeholder="Code à 6 chiffres" aria-label="Code de la session Main levée">
        <button class="btn primaire" type="submit">Afficher</button>
      </form>
      <button class="btn petit" id="ml-ouvrir" type="button">Ouvrir le quiz dans L’Établi (lancer, voir les réponses)</button>
    </div>
    <div style="display:grid;grid-template-rows:auto 1fr;gap:6px;min-height:0">
      <p class="etiquette">Notes <span><button class="btn petit" id="b-a-moins" aria-label="Notes plus petites">A−</button> <button class="btn petit" id="b-a-plus" aria-label="Notes plus grandes">A+</button></span></p>
      <div id="notes"></div>
    </div>
  </section>
</main>
<footer id="bande" aria-label="Toutes les diapositives"></footer>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/commun.js"></script>
<script src="/js/presentateur.js"></script>
</body>
</html>
