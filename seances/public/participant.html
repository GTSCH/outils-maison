<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Séance</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/polices.css">
<link rel="stylesheet" href="/css/seances.css">
<style>
  body { min-height: 100vh; }
  .entete { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .entete .t { flex: 1; min-width: 0; }
  .entete h1 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entete p { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #b-suivre.actif { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 14px; }
  #cadre { position: relative; width: 100%; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); background: #fff; touch-action: pan-y pinch-zoom; }
  #cadre:fullscreen { background: #000; border-radius: 0; }
  .nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .nav .milieu { display: flex; gap: 6px; align-items: center; }
  #num { font: 700 16px var(--font-display); min-width: 64px; text-align: center; }
  .nav .btn { min-height: 46px; }
  #texte { background: var(--surface); border-radius: 10px; padding: 18px; display: grid; gap: 12px; font-size: 18px; line-height: 1.5; }
  #texte h2 { font-size: 22px; }
  #texte .puces { padding-left: 1.2em; margin: 0; display: grid; gap: 6px; }
  #texte .puces li.n1 { margin-left: 1em; } #texte .puces li.n2 { margin-left: 2em; }
  #texte img { max-width: 100%; border-radius: 8px; }
  section.bloc { background: var(--surface); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
  section.bloc h3, section.bloc h2 { font-size: 17px; }
  section.bloc ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; }
  .acces { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--muted); font-size: 12px; font-weight: 700; }
  #question iframe { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #question .repondre { min-height: 56px; font-size: 19px; }
  #question .q-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #liste { list-style: none; padding: 0 !important; }
  #liste button { width: 100%; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--fg); font: 15px/1.3 var(--font-ui); cursor: pointer; }
  #liste button.actif { border-color: var(--accent); background: var(--accent-soft); }
  .res.pdf { font-weight: 700; }
  .faible { color: var(--faint); font-size: 14px; }
  #etat { color: var(--bad); font-size: 13px; min-height: 1em; text-align: center; }
  .message { padding: 40px 20px; display: grid; gap: 12px; text-align: center; }
  .pied { text-align: center; font-size: 13px; color: var(--faint); }
</style>
</head>
<body>
<div id="app">
  <header class="entete">
    <div class="t"><h1 id="titre">Séance</h1><p id="sous"></p></div>
    <button class="btn petit" id="b-suivre" aria-pressed="true">Suivre le cours</button>
  </header>
  <main>
    <div id="cadre" aria-live="polite"></div>
    <div class="nav">
      <button class="btn" id="b-prec" aria-label="Diapositive précédente">◀</button>
      <div class="milieu">
        <span id="num"></span>
        <button class="btn petit" id="b-grand" title="Afficher en plein écran">Agrandir</button>
        <button class="btn petit" id="b-texte" aria-pressed="false" title="Lire le texte en grand">Texte</button>
      </div>
      <button class="btn" id="b-suiv" aria-label="Diapositive suivante">▶</button>
    </div>
    <p id="etat" role="status"></p>
    <div id="texte" hidden></div>
    <section class="bloc" id="question" hidden></section>
    <section class="bloc" id="sources" hidden></section>
    <section class="bloc"><h2>Ressources</h2><ul id="ressources"></ul></section>
    <section class="bloc"><h2>Toutes les diapositives</h2><ul id="liste"></ul></section>
    <p class="pied">Séances · prototype en test de Guillaume Tschupp</p>
  </main>
</div>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/commun.js"></script>
<script src="/js/participant.js"></script>
</body>
</html>
