<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Séances</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/polices.css">
<link rel="stylesheet" href="/css/seances.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .boite { width: min(100%, 520px); display: grid; gap: 18px; }
  h1 { font-size: clamp(34px, 7vw, 52px); }
  form { display: flex; border: 3px solid var(--fg); border-radius: 8px; overflow: hidden; }
  form input { border: 0; border-radius: 0; font: 700 34px/1 var(--font-display); letter-spacing: .14em; text-align: center; text-transform: lowercase; }
  form .btn { border: 0; border-radius: 0; min-width: 110px; font-size: 20px; }
  .pied { font-size: 13px; color: var(--faint); }
</style>
</head>
<body>
<main class="boite">
  <h1>Séances</h1>
  <p>Entrez le code de la séance donné par votre enseignant·e, ou scannez le QR projeté.</p>
  <form id="f"><label class="sr" for="c">Code de la séance</label><input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16" placeholder="ab3k9x"><button class="btn primaire">Entrer</button></form>
  <p class="pied">Prototype en test de Guillaume Tschupp. Sans compte, sans traceur.</p>
</main>
<script>
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const c = document.getElementById("c").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    if (c) location.href = "/s/" + c;
  };
</script>
</body>
</html>
