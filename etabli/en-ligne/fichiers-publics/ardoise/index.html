    });
    el.addEventListener('input', (e) => { if (e.target.id === 'grN') { const v = parseInt(e.target.value, 10); if (v > 0) { d.n = clamp(v, 1, 20); d.groups = null; ctx.save(); } } });
  },
  onCfgClose(ctx) { ctx.setTitle(ctx.def.title(ctx.d)); if (!ctx.d.groups) A.remount(ctx.w.id); },
});

/* ---------- Dés ---------- */
const PIPS = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]], 5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]], 6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]] };
const DCOLS = ['#FFFFFF', '#D0352B', '#2456C9', '#1C8549', '#E0A100', '#7A4BC2'];
def('dice', {
  name: 'Dés', short: 'Dés', icon: 'dice', group: 'Classe', size: [0.3, 0.34],
  init: () => ({ count: 2, faces: 6, style: 'pips', words: ['rouge', 'bleu', 'vert', 'jaune', 'orange', 'violet'], imgs: [], vals: [3, 5], showSum: true }),
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    function faceMax() { return d.faces === 'words' ? Math.max(1, d.words.length) : d.faces === 'imgs' ? Math.max(1, d.imgs.length) : d.faces; }
    function dieSvg(v, i) {
      const col = DCOLS[i % DCOLS.length], light = i % DCOLS.length === 0 || i % DCOLS.length === 4;
      const fg = light ? '#1A1F22' : '#FFFFFF';
      if (d.faces === 6 && d.style === 'pips') {
        return '<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" fill="' + col + '" stroke="#1A1F22" stroke-width="3"/>' + (PIPS[v] || []).map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="8.5" fill="' + fg + '"/>').join('') + '</svg>';
      }
      let shape;
      if (d.faces === 10) shape = '<path d="M50 3L95 40 50 97 5 40z" fill="' + col + '" stroke="#1A1F22" stroke-width="3" stroke-linejoin="round"/>';
      else if (d.faces === 20) shape = '<path d="M50 3L92 26v48L50 97 8 74V26z" fill="' + col + '" stroke="#1A1F22" stroke-width="3" stroke-linejoin="round"/><path d="M50 22L76 66H24z" fill="none" stroke="' + fg + '" stroke-opacity=".3" stroke-width="2"/>';
      else shape = '<rect x="4" y="4" width="92" height="92" rx="18" fill="' + col + '" stroke="#1A1F22" stroke-width="3"/>';
      return '<svg viewBox="0 0 100 100">' + shape + '</svg>';
    }
    function label(v) {
      if (d.faces === 'words') return esc(d.words[v - 1] || '');
      if (d.faces === 'imgs') return '';
      return String(v);
    }
    function paint(rolling) {
      const n = clamp(d.count, 1, 6);
      while (d.vals.length < n) d.vals.push(1 + rnd(faceMax()));
      const vals = d.vals.slice(0, n).map((v) => clamp(v, 1, faceMax()));
      const numeric = typeof d.faces === 'number';
      f.innerHTML = '<button class="dice" aria-label="Lancer les dés" title="Toucher pour lancer">' + vals.map((v, i) => {
        const light = i % DCOLS.length === 0 || i % DCOLS.length === 4;
        const lab = d.faces === 6 && d.style === 'pips' ? '' : '<span class="lbl" style="color:' + (light ? '#1A1F22' : '#fff') + ';' + (d.faces === 10 ? 'padding-bottom:8%;' : '') + '">' + label(v) + '</span>';
        const img = d.faces === 'imgs' && d.imgs[v - 1] ? '<img alt="" src="' + d.imgs[v - 1] + '">' : '';
        return '<span class="die' + (rolling ? ' roll' : '') + '" role="img" aria-label="' + (d.faces === 'imgs' ? 'Image ' + v : label(v) || v) + '">' + dieSvg(v, i) + lab + img + '</span>';
      }).join('') + '</button>' +
        (numeric && n > 1 && d.showSum ? '<div class="dice-tot big">Total' + NB + ': ' + vals.reduce((s, v) => s + v, 0) + '</div>' : '') +
        '<div class="wctl"><button class="wb pri" data-a="roll">' + ico('dice') + 'Lancer</button></div>';
      fit();
    }
    function fit() {
      const box = $('.dice', f); if (!box) return;
      const n = clamp(d.count, 1, 6), W = box.clientWidth, H = box.clientHeight;
      let best = 0;
      for (let cols = 1; cols <= n; cols++) { const rows = Math.ceil(n / cols); const s = Math.min((W - (cols - 1) * 14) / cols, (H - (rows - 1) * 14) / rows); if (s > best) best = s; }
      best = clamp(best * 0.92, 40, 420);
      box.style.setProperty('--ds', best + 'px'); box.style.setProperty('--dg', Math.round(best * 0.14) + 'px');
      $$('.lbl', box).forEach((l) => { const t = l.textContent.length; l.style.fontSize = (t <= 2 ? best * 0.42 : best * Math.min(0.42, 1.25 / t)) + 'px'; });
    }
    let rt = null;
    function roll() {
      const n = clamp(d.count, 1, 6), m = faceMax();
      const fin = () => { d.vals = Array.from({ length: n }, () => 1 + rnd(m)); paint(false); ctx.save(); };
      if (A.reduced()) { fin(); return; }
      let k = 0;
      const step = () => { if (!ctx.alive) return; d.vals = Array.from({ length: n }, () => 1 + rnd(m)); paint(true); A.tickSound(); k++; if (k < 7) rt = setTimeout(step, 70 + k * 18); else fin(); };
      step();
    }
    f.addEventListener('click', (e) => { if (e.target.closest('.dice, [data-a="roll"]')) roll(); });
    ctx.onResize = fit; ctx.destroy = () => clearTimeout(rt);
    paint(false);
  },
  cfg(ctx, el) {
    const d = ctx.d;
    el.innerHTML = '<h4>Dés</h4><div class="fld"><span>Nombre de dés</span>' + ui.chips('count', [1, 2, 3, 4, 5, 6].map((n) => [n, String(n)]), d.count) + '</div>' +
      '<div class="fld"><span>Type de dé</span>' + ui.chips('faces', [['6', '6 faces'], ['10', '10 faces'], ['20', '20 faces'], ['words', 'Mots'], ['imgs', 'Images']], d.faces) + '</div>' +
      '<div id="dExtra"></div>';
    function extra() {
      const x = $('#dExtra', el);
      if (d.faces === 6) x.innerHTML = '<div class="fld"><span>Faces</span>' + ui.chips('style', [['pips', 'Points'], ['num', 'Chiffres']], d.style) + '</div>' + ui.check('showSum', 'Afficher le total', d.showSum);
      else if (d.faces === 'words') x.innerHTML = ui.field('Mots du dé (un par ligne, 2 à 20)', '<textarea id="dWords">' + esc(d.words.join('\n')) + '</textarea>');
      else if (d.faces === 'imgs') x.innerHTML = '<div class="fld"><span>Images du dé (2 à 12)</span><div class="dimgs">' + d.imgs.map((s, i) => '<span><img alt="" src="' + s + '"><button data-rmimg="' + i + '" aria-label="Retirer cette image">' + ico('x') + '</button></span>').join('') + '</div><button class="btn" data-x="addimg">' + ico('image') + 'Ajouter des images</button></div>';
      else x.innerHTML = ui.check('showSum', 'Afficher le total', d.showSum);
    }
    extra();
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-k][data-v]');
      if (b) {
        const k = b.dataset.k, v = b.dataset.v;
        d[k] = k === 'count' ? +v : k === 'faces' ? (/^\d+$/.test(v) ? +v : v) : v;
        if (k === 'faces') d.vals = [];
        $$('[data-k="' + k + '"]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        if (k === 'faces') extra();
        ctx.save();
      }
      if (e.target.closest('[data-x="addimg"]')) {
        $('#anyFile').multiple = true;
        A.pickImage(async (files) => {
          $('#anyFile').multiple = false;
          for (const fl of files.slice(0, 12 - d.imgs.length)) { try { d.imgs.push(await A.readImage(fl, 320)); } catch (err) { /* ignore */ } }
          d.vals = []; extra(); ctx.save();
        });
      }
      const r = e.target.closest('[data-rmimg]');
      if (r) { d.imgs.splice(+r.dataset.rmimg, 1); d.vals = []; extra(); ctx.save(); }
    });
    el.addEventListener('input', (e) => { if (e.target.id === 'dWords') { d.words = e.target.value.split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 20); d.vals = []; ctx.save(); } });
    el.addEventListener('change', (e) => { if (e.target.dataset.k === 'showSum') { d.showSum = e.target.checked; ctx.save(); } });
  },
  onCfgClose(ctx) { $('#anyFile').multiple = false; A.remount(ctx.w.id); },
});

/* ---------- Niveau de voix ---------- */
def('voice', {
  name: 'Niveau de voix', short: 'Voix', icon: 'voice', group: 'Classe', size: [0.36, 0.42],
  init: () => ({ level: 2 }),
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    function paint() {
      const v = A.VOIX[d.level];
      f.style.setProperty('--vc', v.c);
      f.innerHTML = '<div class="vx-cur">' + A.voixSvg(d.level) + '<div class="vx-txt"><span class="vx-n big">' + d.level + '</span><span class="vx-l eleve">' + v.l + '</span></div></div>' +
        '<div class="vx-scale" role="group" aria-label="Choisir le niveau autorisé">' + A.VOIX.map((x, i) => '<button data-l="' + i + '" aria-pressed="' + (i === d.level) + '" style="--vc:' + x.c + '">' + A.voixSvg(i) + '<span>' + i + ' ' + x.l + '</span></button>').join('') + '</div>';
    }
    f.addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (!b) return; d.level = +b.dataset.l; paint(); ctx.save(); });
    paint();
  },
});

/* ---------- Sonomètre ---------- */
def('sound', {
  name: 'Sonomètre', short: 'Bruit', icon: 'mic', group: 'Classe', size: [0.32, 0.36],
  init: () => ({ threshold: 60 }),
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    f.classList.add('sn');
    let stream = null, raf = 0, an = null, src = null, level = 0, overT = 0;
    function idle(msg, err) {
      f.classList.remove('alert');
      f.innerHTML = '<div class="sn-state big">' + (err ? 'Micro indisponible' : 'Sonomètre') + '</div><p class="wmsg">' + msg + '</p>' + (err ? '<div class="wctl"><button class="wb" data-a="start">' + ico('reset') + 'Réessayer</button></div>' : '<div class="wctl"><button class="wb pri" data-a="start">' + ico('mic') + 'Activer le micro</button></div>');
    }
    function stop() { cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; try { src && src.disconnect(); } catch (e) { /* rien */ } src = null; }
    async function start() {
      const fp = document.permissionsPolicy || document.featurePolicy;
      const blocked = fp && fp.allowsFeature && !fp.allowsFeature('microphone');
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (blocked || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !Ctx) {
        idle(window.isSecureContext === false ? 'Le micro demande une page sécurisée (adresse en https).' : 'Le micro n’est pas disponible dans ce navigateur.', true); return;
      }
      let ac = null;
      try { ac = new Ctx(); } catch (e) { ac = null; }
      if (!ac) { idle('Le son n’est pas disponible dans ce navigateur.', true); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      } catch (e) {
        try { ac.close(); } catch (err) { /* rien */ }
        const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
        idle(denied ? 'Le micro a été refusé. Autorise-le pour cette page (icône à gauche de l’adresse), puis réessaie.' : 'Aucun micro n’a été trouvé. Branche un micro puis réessaie.', true);
        return;
      }
      if (!ctx.alive) { stop(); return; }
      src = ac.createMediaStreamSource(stream); an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
      const buf = new Float32Array(an.fftSize);
      f.innerHTML = '<div class="sn-state big" aria-live="polite">Calme</div><div class="sn-gauge"><div class="sn-bar"></div><div class="sn-th"></div></div><label>Seuil<input type="range" min="10" max="95" value="' + d.threshold + '" aria-label="Seuil de bruit"></label><div class="wctl"><button class="wb" data-a="stop">Arrêter</button></div>';
      const bar = $('.sn-bar', f), th = $('.sn-th', f), st = $('.sn-state', f);
      th.style.left = d.threshold + '%';
      $('input', f).addEventListener('input', (e) => { d.threshold = +e.target.value; th.style.left = d.threshold + '%'; ctx.save(); });
      const loop = () => {
        an.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        const rms = Math.sqrt(s / buf.length), db = 20 * Math.log10(rms + 1e-8);
        const v = clamp(((db + 62) / 52) * 100, 0, 100);
        level = level * 0.82 + v * 0.18;
        bar.style.width = level.toFixed(1) + '%';
        const hot = level > d.threshold;
        bar.classList.toggle('hot', hot);
        if (hot) overT = Math.min(overT + 1, 90); else overT = Math.max(0, overT - 2);
        const alert = overT > 40;
        f.classList.toggle('alert', alert);
        st.textContent = alert ? 'Trop de bruit' : hot ? 'Attention' : 'Calme';
        raf = requestAnimationFrame(loop);
      };
      loop();
      ctx.destroy = () => { stop(); try { ac.close(); } catch (e) { /* rien */ } };
    }
    f.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'start') start(); if (b.dataset.a === 'stop') { stop(); idle('Le sonomètre est à l’arrêt.'); } });
    idle('Mesure le bruit de la classe avec le micro de l’ordinateur. Le son n’est ni enregistré ni envoyé.');
    ctx.destroy = stop;
  },
});

/* ---------- Feu tricolore ---------- */
const FEU = [{ k: 'red', c: '#E5372B', l: 'Stop, on écoute' }, { k: 'orange', c: '#F2A20C', l: 'On se prépare' }, { k: 'green', c: '#2DB34A', l: 'On peut y aller' }];
def('light', {
  name: 'Feu tricolore', short: 'Feu', icon: 'light', group: 'Classe', size: [0.16, 0.5],
  init: () => ({ on: 2, labels: FEU.map((x) => x.l), showLabel: true }),
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    f.classList.add('fe');
    function paint() {
      f.innerHTML = '<button class="fe-box" aria-label="Changer la couleur du feu" title="Toucher pour changer">' + FEU.map((x, i) => '<i class="' + (d.on === i ? 'on' : '') + '" style="--lc:' + x.c + '"></i>').join('') + '</button>' + (d.showLabel ? '<div class="fe-cap eleve" aria-live="polite">' + esc(d.labels[d.on] || '') + '</div>' : '');
    }
    f.addEventListener('click', (e) => { if (!e.target.closest('.fe-box')) return; d.on = (d.on + 2) % 3; paint(); ctx.save(); });
    paint();
  },
  cfg(ctx, el) {
    const d = ctx.d;
    el.innerHTML = '<h4>Feu tricolore</h4><p class="hint">Toucher le feu passe du vert à l’orange puis au rouge.</p>' + FEU.map((x, i) => ui.field('Texte du ' + ['rouge', 'orange', 'vert'][i], '<input type="text" data-li="' + i + '" maxlength="40" value="' + esc(d.labels[i]) + '">')).join('') + ui.check('showLabel', 'Afficher le texte', d.showLabel);
    el.addEventListener('input', (e) => { if (e.target.dataset.li) { d.labels[+e.target.dataset.li] = e.target.value; ctx.save(); } });
    el.addEventListener('change', (e) => { if (e.target.dataset.k) { d.showLabel = e.target.checked; ctx.save(); } });
  },
  onCfgClose(ctx) { A.remount(ctx.w.id); },
});

/* ---------- Consignes de travail ---------- */
def('signs', {
  name: 'Consignes de travail', short: 'Consignes', icon: 'signs', group: 'Classe', size: [0.34, 0.36],
  init: () => ({ on: ['seul', 'silence'] }),
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    f.style.setProperty('--pbg', 'var(--accent-soft)');
    function paint() {
      if (!d.on.length) { f.innerHTML = '<p class="wmsg">Choisis une ou plusieurs consignes dans les réglages.</p>'; return; }
      f.innerHTML = '<div class="cs-grid">' + d.on.map((k) => { const c = A.CONSIGNES[k]; return c ? '<div class="cs-card">' + c.s + '<span>' + c.l + '</span></div>' : ''; }).join('') + '</div>';
      fit();
    }
    function fit() {
      const n = d.on.length; if (!n) return;
      const W = f.clientWidth, H = f.clientHeight;
      let best = 1, bs = 0;
      for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c); const s = Math.min(W / c, (H / r) * 1.1); if (s > bs) { bs = s; best = c; } }
      f.style.setProperty('--cols', best);
      const cw = W / best, ch = H / Math.ceil(n / best);
      const longest = Math.max(...d.on.map((k) => (A.CONSIGNES[k] ? A.CONSIGNES[k].l.length : 4)));
      f.style.setProperty('--cfs', clamp(Math.min(ch * 0.13, (cw * 1.7) / Math.max(8, longest)), 12, 56) + 'px');
    }
    ctx.onResize = fit;
    paint();
  },
  cfgOnAdd: true,
  cfg(ctx, el) {
    const d = ctx.d;
    el.style.setProperty('--pbg', 'var(--accent-soft)');
    el.innerHTML = '<h4>Consignes de travail</h4><p class="hint">Touche-les pour en afficher une ou plusieurs.</p><div class="cschips">' + Object.keys(A.CONSIGNES).map((k) => '<button data-cs="' + k + '" aria-pressed="' + (d.on.indexOf(k) >= 0) + '">' + A.CONSIGNES[k].s + A.CONSIGNES[k].l + '</button>').join('') + '</div>';
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cs]'); if (!b) return;
      const k = b.dataset.cs, i = d.on.indexOf(k);
      if (i >= 0) d.on.splice(i, 1); else d.on.push(k);
      b.setAttribute('aria-pressed', String(i < 0)); ctx.save();
    });
  },
  onCfgClose(ctx) { A.remount(ctx.w.id); },
});
})();
</script>
<script>
/* Fenêtres « Contenu » : texte, image, QR code, vote */
(function () {
'use strict';
const A = window.ARDOISE;
const { $, $$, esc, clamp, ico, NB, ui } = A;
const def = A.defWidget;

/* ---------- Texte ---------- */
const TSIZES = [['auto', 'Ajustée à la fenêtre', 0], ['s', 'Petit', 6], ['m', 'Moyen', 9], ['l', 'Grand', 13], ['xl', 'Très grand', 19]];
const TCOL = [['ink', 'Encre'], ['red', 'Rouge'], ['blue', 'Bleu'], ['green', 'Vert']];
def('text', {
  name: 'Texte', short: 'Texte', icon: 'text', group: 'Contenu', size: [0.34, 0.3],
  init: () => ({ text: '', size: 'auto', align: 'left', color: 'ink', font: 'eleve', bare: false }),
  title: () => 'Texte',
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    f.className = 'face'; f.style.padding = '0';
    ctx.win.classList.toggle('bare', !!d.bare);
    const tx = document.createElement('div');
    tx.className = 'tx f-' + d.font;
    tx.setAttribute('contenteditable', 'true');
    try { tx.setAttribute('contenteditable', 'plaintext-only'); if (tx.contentEditable !== 'plaintext-only') tx.setAttribute('contenteditable', 'true'); } catch (e) { tx.setAttribute('contenteditable', 'true'); }
    tx.setAttribute('role', 'textbox'); tx.setAttribute('aria-multiline', 'true'); tx.setAttribute('aria-label', 'Texte libre');
    tx.dataset.ph = 'Touche ici pour écrire…';
    tx.spellcheck = false;
    tx.textContent = d.text;
    const sz = (TSIZES.find((s) => s[0] === d.size) || TSIZES[0])[2];
    if (sz) tx.style.fontSize = 'max(15px, ' + sz + 'cqmin)';
    function fit() {
      if (sz || !tx.isConnected) return;
      const Hh = tx.clientHeight, Ww = tx.clientWidth;
      if (!Hh || !Ww) return;
      if (!tx.textContent.trim()) { tx.style.fontSize = clamp(Hh * 0.18, 15, 34) + 'px'; return; }
      let lo = 12, hi = clamp(Hh * 0.75, 16, 260);
      const ok = (v) => { tx.style.fontSize = v + 'px'; return tx.scrollHeight <= Hh + 1 && tx.scrollWidth <= Ww + 1; };
      if (ok(hi)) return;
      for (let k = 0; k < 9; k++) { const m = (lo + hi) / 2; if (ok(m)) lo = m; else hi = m; }
      tx.style.fontSize = Math.floor(lo) + 'px';
    }
    ctx.onResize = fit;
    tx.style.textAlign = d.align;
    const dark = A.isDark(A.page().bg);
    tx.style.color = d.color === 'ink' ? '' : A.colorOf(d.color, d.bare ? dark : document.documentElement.matches('[data-theme="dark"]') || (matchMedia('(prefers-color-scheme: dark)').matches && !document.documentElement.matches('[data-theme="light"]')));
    tx.addEventListener('input', () => { d.text = tx.innerText.replace(/\n$/, ''); fit(); ctx.save(); });
    tx.addEventListener('paste', (e) => {
      if (tx.contentEditable === 'plaintext-only') return;
      e.preventDefault();
      const t = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, t);
    });
    f.appendChild(tx);
    requestAnimationFrame(fit);
  },
  cfg(ctx, el) {
    const d = ctx.d;
    el.innerHTML = '<h4>Texte</h4>' +
      '<div class="fld"><span>Taille</span>' + ui.chips('size', TSIZES.map((s) => [s[0], s[1]]), d.size) + '</div>' +
      '<div class="fld"><span>Alignement</span>' + ui.chips('align', [['left', 'À gauche'], ['center', 'Centré'], ['right', 'À droite']], d.align) + '</div>' +
      '<div class="fld"><span>Police</span>' + ui.chips('font', [['eleve', 'Élève (Andika)'], ['display', 'Affichage'], ['ui', 'Simple']], d.font) + '</div>' +
      '<div class="fld"><span>Couleur</span>' + ui.chips('color', TCOL, d.color) + '</div>' +
      ui.check('bare', 'Sans cadre : le texte est posé sur le tableau', d.bare);
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-k][data-v]'); if (!b) return;
      d[b.dataset.k] = b.dataset.v;
      $$('[data-k="' + b.dataset.k + '"]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); ctx.save();
    });
    el.addEventListener('change', (e) => { if (e.target.dataset.k === 'bare') { d.bare = e.target.checked; ctx.save(); } });
  },
  onCfgClose(ctx) { A.remount(ctx.w.id); },
});

/* ---------- Image ---------- */
def('image', {
  name: 'Image', short: 'Image', icon: 'image', group: 'Contenu', size: [0.3, 0.4],
  init: () => ({ src: null, fit: 'contain' }),
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    async function load(files) {
      const fl = files && files[0]; if (!fl) return;
      try { d.src = await A.readImage(fl, 1400); paint(); ctx.save(); }
      catch (e) { A.toast('Cette image n’a pas pu être lue. Essaie un fichier JPG ou PNG.'); }
    }
    function paint() {

/* ---------- QR code ---------- */
function qrSvg(text) {
  if (typeof window.qrcode !== 'function') return null;
  try {
    if (window.qrcode.stringToBytesFuncs && window.qrcode.stringToBytesFuncs['UTF-8']) window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];
    const q = window.qrcode(0, 'M'); q.addData(text, 'Byte'); q.make();
    const n = q.getModuleCount(), m = 2;
    let p = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
    return '<svg viewBox="0 0 ' + (n + 2 * m) + ' ' + (n + 2 * m) + '" shape-rendering="crispEdges" role="img" aria-label="QR code vers ' + esc(text) + '"><rect width="100%" height="100%" fill="#fff"/><path d="' + p + '" fill="#000"/></svg>';
  } catch (e) { return 'long'; }
}
def('qr', {
  name: 'QR code', short: 'QR', icon: 'qr', group: 'Contenu', size: [0.24, 0.5],

    const s = qrSvg(u);
    if (s === null) { f.innerHTML = '<p class="wmsg">Le générateur de QR code n’a pas pu se charger. Il faut une connexion internet à la première ouverture.</p><div class="qr-url">' + esc(u) + '</div>'; return; }
    if (s === 'long') { f.innerHTML = '<p class="wmsg">Cette adresse est trop longue pour un QR code lisible. Raccourcis-la.</p>'; return; }
    f.innerHTML = '<div class="qr-box">' + s + '</div><div class="qr-url">' + esc(u.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</div>';
  },
  cfg(ctx, el) {
    const d = ctx.d;
    el.innerHTML = '<h4>QR code</h4>' + A.ui.field('Adresse (lien) à partager', '<input type="url" id="qrU" inputmode="url" placeholder="https://..." value="' + esc(d.url) + '">') + '<p class="hint">Le QR code est fabriqué dans ce navigateur : l’adresse n’est envoyée nulle part.</p>';
    el.addEventListener('input', (e) => { if (e.target.id === 'qrU') { d.url = e.target.value.trim(); ctx.save(); } });

});

        '<div class="row"><button class="btn" data-x="add"' + (d.opts.length >= 8 ? ' disabled' : '') + '>' + ico('plus') + 'Ajouter une réponse</button><button class="btn" data-x="yn">Oui / Non</button></div>';

    el.addEventListener('click', (e) => {

      if (x && x.dataset.x === 'add') { d.opts.push({ l: 'Réponse ' + (d.opts.length + 1), n: 0 }); draw(); ctx.save(); }
      if (x && x.dataset.x === 'yn') { d.opts = [{ l: 'Oui', n: 0 }, { l: 'Non', n: 0 }]; draw(); ctx.save(); }
      if (del) { d.opts.splice(+del.dataset.del, 1); draw(); ctx.save(); }

});

<script>
/* Exercice flash (utilise window.FABRIQUE si chargé) */
(function () {
'use strict';
const A = window.ARDOISE;
const { $, $$, esc, clamp, ico, NB, ui } = A;
const def = A.defWidget;

function pickLevel(gen, want) {
  if (gen.levels.indexOf(want) >= 0) return want;
  const F = A.FAB(), t = F ? F.lv(want) : 6;
  return gen.levels.slice().sort((a, b) => Math.abs(F.lv(a) - t) - Math.abs(F.lv(b) - t))[0];
}
function defaultGen() {
  const F = A.FAB(); if (!F || !F.generators.length) return null;
  const g = F.get('maths.calcul.flash') || F.get('demo.addition') || F.generators[0];
  return { gen: g.id, level: pickLevel(g, '6H') };
}
A.defaultFlash = defaultGen;
const newSeed = () => { const F = A.FAB(); return F ? F.newSeed() : Math.random().toString(36).slice(2, 8); };
const strip = (s) => String(s || '').replace(/<[^>]*>/g, '').replace(/&[a-z#0-9]+;/gi, 'x');

function build(d) {
  const F = A.FAB(), gen = F && F.get(d.gen);
  if (gen) {
    let blk = null;
    try { blk = F.buildBlock({ gen: d.gen, level: d.level, count: d.count, opts: d.opts || {} }, d.seed, 0); } catch (e) { blk = null; }
    if (blk && blk.items && blk.items.length) {
      d.items = blk.items; d.ins = blk.instruction || ''; d.gtitle = gen.title; d.lvl = blk.level; d.subject = gen.subject;
      return 'ok';
    }
  }
  if (Array.isArray(d.items) && d.items.length) return 'saved';
  return F && F.generators.length ? 'nogen' : 'nofab';
}
function ansHtml(item) {
  const F = A.FAB();
  const a = String(item.answer == null ? '' : item.answer);
  const m = /^(-?\d+)\/(\d+)$/.exec(a.replace(/\s/g, ''));
  if (item.kind === 'fraction' && m && F) return F.frac(m[1].replace('-', '−'), m[2]);
  return esc(a);
}
function sep(prev, t) {
  if (/^[.,)…]$/.test(t) || /^[.,]/.test(t)) return '';
  if (/^[;:!?»]$/.test(t)) return NB;
  if (/['’]$/.test(prev) || prev === '(') return '';
  if (prev === '«') return NB;
  return ' ';
}
function tokHtml(tokens, hit) {
  return tokens.map((t, i) => (i ? sep(tokens[i - 1], t) : '') + '<span class="tok' + (hit && hit.indexOf(i) >= 0 ? ' hit' : '') + '">' + esc(t) + '</span>').join('');
}
function sizeClass(len) { return len <= 22 ? 's-xl' : len <= 46 ? 's-l' : len <= 100 ? 's-m' : 's-s'; }

function renderItem(item, rev, seed) {
  const F = A.FAB();
  let html = '', len = 0;
  const fig = item.figure ? item.figure : '';
  let p = item.prompt || '';
  if (item.type === 'input') {
    const unit = item.unit ? NB + esc(item.unit) : '';
    const blank = '<span class="blank' + (rev ? ' show' : '') + '">' + (rev ? ansHtml(item) : '&nbsp;') + '</span>' + unit;
    p = p.indexOf('___') >= 0 ? p.replace('___', blank) : p + ' ' + blank;
    len = strip(item.prompt).length;
    html = '<div class="fx-p ' + sizeClass(len) + '">' + p + '</div>';
  } else if (item.type === 'choice') {
    const ch = item.choices || [];
    if (p.indexOf('___') >= 0) p = p.replace('___', '<span class="blank' + (rev ? ' show' : '') + '">' + (rev ? ch[item.correct] : '&nbsp;') + '</span>');
    len = strip(item.prompt).length;
    html = '<div class="fx-p ' + sizeClass(len) + '">' + p + '</div><div class="fx-ch">' + ch.map((c, i) => '<span class="' + (rev ? (i === item.correct ? 'ok' : 'dim') : '') + '">' + c + '</span>').join('') + '</div>';
  } else if (item.type === 'tokens') {
    const toks = item.tokens || [];
    len = toks.join(' ').length;
    html = (p ? '<div class="fx-p s-s">' + p + '</div>' : '') + '<div class="fx-p fx-tk ' + sizeClass(len) + '">' + tokHtml(toks, rev ? item.correct : null) + '</div>';
  } else if (item.type === 'order') {
    const toks = item.tokens || [];
    const order = F ? F.orderShuffle(item, seed) : toks.map((_, i) => i).reverse();
    len = toks.join(' ').length;
    html = (p ? '<div class="fx-p s-s">' + p + '</div>' : '') + '<div class="fx-p fx-or ' + sizeClass(len + 16) + '">' + order.map((i) => '<span>' + esc(toks[i]) + '</span>').join('') + '</div>' +
      (rev ? '<div class="fx-p fx-ans ' + sizeClass(len + 16) + '">' + esc(F ? F.joinTokens(toks) : toks.join(' ')) + '</div>' : '');
  } else {
    html = '<div class="fx-p s-m">' + p + '</div>';
  }
  if (rev && item.solution) html += '<div class="fx-sol">' + item.solution + '</div>';
  return { html: fig + html, fig: !!fig };
}

def('flash', {
  name: 'Exercice flash', short: 'Flash', icon: 'flash', group: 'Exercices', size: [0.5, 0.6],
  init: () => { const g = defaultGen() || { gen: 'maths.calcul.flash', level: '6H' }; return { gen: g.gen, level: g.level, count: 10, auto: 0, seed: newSeed(), idx: 0, rev: false, opts: {}, items: null, bare: false }; },
  title: (d) => d.gtitle ? 'Flash : ' + d.gtitle : 'Exercice flash',
  mount(ctx) {
    const d = ctx.d, f = ctx.face;
    f.classList.add('fx', 'eleve');
    ctx.win.classList.toggle('bare', !!d.bare);
    const st = build(d);
    ctx.setTitle(ctx.def.title(d));
    if (st === 'nofab' || st === 'nogen') {
      f.innerHTML = ico('flash') + '<p class="wmsg">' + (st === 'nofab' ? 'Les exercices de la Fabrique n’ont pas pu être chargés. Recharge la page.' : 'Cet exercice n’existe plus. Choisis-en un autre dans les réglages.') + '</p>' + (st === 'nogen' ? '<button class="wb pri" data-a="cfg">Choisir un exercice</button>' : '');
      f.addEventListener('click', (e) => { if (e.target.closest('[data-a="cfg"]')) ctx.openCfg(); });
      return;
    }
    let autoOn = d.auto > 0, t0 = performance.now(), raf = 0, nextT = null;
    function paint() {
      const n = d.items.length;
      d.idx = clamp(d.idx, 0, n);
      cancelAnimationFrame(raf); clearTimeout(nextT);
      const top = '<div class="fx-top"><span>' + esc(d.gtitle || 'Exercice') + (d.lvl ? ', ' + esc(d.lvl) : '') + '</span>' + (d.auto > 0 && d.idx < n ? '<button class="fx-auto" data-a="auto" title="' + (autoOn ? 'Mettre en pause le défilement' : 'Reprendre le défilement') + '">' + ico(autoOn ? 'pause' : 'play') + d.auto + NB + 's</button>' : '') + '<span class="fx-cnt">' + Math.min(d.idx + 1, n) + NB + '/' + NB + n + '</span></div>';
      if (d.idx >= n) {
        f.innerHTML = top + '<div class="fx-stage"><div class="fx-end big">Série terminée' + NB + '!</div><p class="wmsg">' + n + ' items. Recommencer la même série, ou en tirer une nouvelle.</p></div><div class="wctl"><button class="wb" data-a="restart">' + ico('reset') + 'Recommencer</button><button class="wb pri" data-a="new">' + ico('shuffle') + 'Nouvelle série</button></div>';
        return;
      }
      const it = d.items[d.idx], r = renderItem(it, d.rev, d.seed);
      f.innerHTML = top + (d.ins ? '<div class="fx-ins">' + d.ins + '</div>' : '') + '<div class="fx-stage' + (r.fig ? ' has-fig' : '') + '" aria-live="polite">' + r.html + '</div>' +
        (d.auto > 0 ? '<div class="fx-prog" aria-hidden="true"><i></i></div>' : '') +
        '<div class="wctl"><button class="wb sq" data-a="prev" title="Item précédent" aria-label="Item précédent"' + (d.idx ? '' : ' disabled') + '>' + ico('left') + '</button>' +
        '<button class="wb' + (d.rev ? '' : ' pri') + '" data-a="rev">' + ico('eye') + (d.rev ? 'Cacher' : 'Réponse') + '</button>' +
        '<button class="wb' + (d.rev ? ' pri' : '') + '" data-a="next">' + (d.idx === n - 1 ? 'Terminer' : 'Suivant') + ico('next') + '</button></div>';
      if (d.auto > 0 && autoOn) { t0 = performance.now(); runAuto(); }
    }
    function runAuto() {
      const bar = $('.fx-prog i', f);
      const dur = d.auto * 1000;
      const loop = () => {
        if (!ctx.alive) return;
        const k = Math.min(1, (performance.now() - t0) / dur);
        if (bar) bar.style.width = (d.rev ? 100 : k * 100) + '%';
        if (!d.rev && k >= 1) { d.rev = true; ctx.save(); paintKeep(); nextT = setTimeout(() => { if (ctx.alive && autoOn) { d.idx++; d.rev = false; ctx.save(); paint(); } }, 3500); return; }
        if (!d.rev) raf = requestAnimationFrame(loop);
      };
      if (d.rev) { if (bar) bar.style.width = '100%'; nextT = setTimeout(() => { if (ctx.alive && autoOn) { d.idx++; d.rev = false; ctx.save(); paint(); } }, 3500); }
      else raf = requestAnimationFrame(loop);
    }
    function paintKeep() {
      const it = d.items[d.idx], r = renderItem(it, d.rev, d.seed);
      const stg = $('.fx-stage', f); if (stg) stg.innerHTML = r.html;
      const rb = $('[data-a="rev"]', f); if (rb) { rb.className = 'wb'; rb.innerHTML = ico('eye') + 'Cacher'; }
      const nb = $('[data-a="next"]', f); if (nb) nb.className = 'wb pri';

    }
    f.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;

    });

  },
  cfg(ctx, el) {
    const d = ctx.d, F = A.FAB();
    if (!F || !F.generators.length) { el.innerHTML = '<h4>Exercice flash</h4><p class="hint">Les exercices ne sont pas chargés : la série enregistrée reste utilisable.</p>'; return; }
    const draw = () => {
      let gen = F.get(d.gen);

      let subj = gen ? gen.subject : subjects[0];
      if (!gen) { gen = F.generators.find((g) => g.subject === subj); d.gen = gen.id; d.level = pickLevel(gen, '6H'); }

        if (o.type === 'select') opts += ui.field(o.label, '<select data-o="' + esc(o.id) + '">' + o.choices.map((c) => '<option value="' + esc(c.value) + '"' + (String(c.value) === String(v) ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('') + '</select>');

        else if (o.type === 'number') opts += ui.field(o.label, '<input type="number" data-o="' + esc(o.id) + '" min="' + (o.min || 0) + '" max="' + (o.max || 9999) + '" value="' + esc(v) + '">');
        else if (o.type === 'multi') opts += '<div class="fld"><span>' + esc(o.label) + '</span><div class="row">' + o.choices.map((c) => '<button class="chip" data-om="' + esc(o.id) + '" data-v="' + esc(c.value) + '" aria-pressed="' + ((v || []).map(String).indexOf(String(c.value)) >= 0) + '">' + esc(c.label) + '</button>').join('') + '</div></div>';
      });
      el.innerHTML = '<h4>Exercice flash</h4>' +
        (subjects.length > 1 ? '<div class="fld"><span>Discipline</span>' + ui.chips('subj', subjects.map((s) => [s, F.SUBJECTS[s].label]), subj) + '</div>' : '') +
        ui.field('Exercice', sel) + (gen.description ? '<p class="hint">' + esc(gen.description) + '</p>' : '') +
        '<div class="fld"><span>Niveau</span>' + ui.chips('level', gen.levels.map((l) => [l, F.LEVEL_LABELS[l] || l]), pickLevel(gen, d.level)) + '</div>' +

        let cur = (d.opts[o.id] || o.default || []).slice(); const c = o.choices.find((x) => String(x.value) === m.dataset.v).value;

const mk = A.makeInstance;
const P = (name, bg, widgets) => ({ id: A.uid(), name, bg: Object.assign({ base: 'white', pat: 'none', color: '#F6E7B5', img: null }, bg), strokes: [], widgets: widgets.map((w, i) => Object.assign(w, { z: i + 1 })) });

A.sanitizePage = function (p) {

      .map((s) => ({ t: s.t, c: A.COLORS.some((c) => c.id === s.c) ? s.c : 'ink', w: clamp(+s.w || 0.006, 0.0005, 0.1), pts: s.pts, pr: s.pr ? 1 : undefined })),

<script>
/* L'Établi : une ardoise est un document « ardoise ».
 * Ouverture : ?doc=<id> ; ?nouveau=1 (+ modele, widget, classe, titre) ; sans paramètre, une ardoise d'accueil.
 * Brouillon : une ardoise nouvelle n'est gardée qu'à la première vraie modification de contenu (trait, texte,
 * fenêtre ajoutée ou retirée, page, fond, titre) ou si l'on touche « Garder ». Utiliser un minuteur, tirer un nom
 * ou lancer les dés ne crée donc pas de document. Ensuite, tout s'enregistre automatiquement (Etabli.autoSave).
 * data = { v: 1, cur, pages: [{ id, name, bg: { base, pat, color, img, fit }, strokes: [{ t, c, w, pts, pr? }],
 *          widgets: [{ id, type, x, y, w, h, z, data }] }] } ; resume = { pages: n }. */
(function () {
'use strict';
const A = window.ARDOISE;
const { $, clamp, NB } = A;
const E = window.Etabli, UI = window.EtabliUI;
const S = A.S;
const q = new URLSearchParams(location.search);
const P = (A.params = {
  doc: q.get('doc'), nouveau: q.get('nouveau') === '1', modele: q.get('modele'), widget: q.get('widget'),
  classe: q.get('classe'), titre: q.get('titre'), presenter: q.get('presenter') === '1',
  minutes: q.get('minutes'), taille: q.get('taille'),
});
/* noms de fenêtres acceptés dans &widget= */
const WPARAM = { minuteur: 'timer', chrono: 'stopwatch', chronometre: 'stopwatch', horloge: 'clock', date: 'date', programme: 'schedule', rebours: 'countdown', tirage: 'picker', groupes: 'groups', des: 'dice', voix: 'voice', bruit: 'sound', sonometre: 'sound', feu: 'light', consignes: 'signs', texte: 'text', image: 'image', qr: 'qr', vote: 'vote', flash: 'flash' };
const D = (A.D = { id: null, brouillon: true, sig: '', auto: null, pret: false, avertiAucun: false, erreurVue: '' });

/* ---------- Barre commune ---------- */
const barre = (D.barre = UI.barre({
  titre: '', editable: true, type: 'ardoise', parent: $('#app'),
  surTitre: () => { if (!D.pret) return; if (D.brouillon) garder(); else D.auto.signaler(); },
  actions: [
    { label: 'Garder', icone: 'check', titre: 'Garder cette ardoise dans tes ardoises', fn: () => garder(true) },
    { label: 'Commencer un essai', icone: 'compte', titre: 'Commencer un essai sans compte : l’ardoise sera gardée dans ce navigateur', fn: commencerEssai },
    { label: 'Présenter', icone: 'projeter', titre: 'Présenter : masque les outils et passe en plein écran', fn: () => A.present(true) },
    { icone: 'menu', titre: 'Plus d’actions', fn: (e, b) => UI.menu(b, menuItems()) },
  ],
}));
const [bGarder, bEssai, bPresenter] = barre.actions.children;
bPresenter.classList.add('act-present');
bEssai.classList.remove('btn-ghost'); bEssai.classList.add('eb-cadre');
bGarder.hidden = true; bEssai.hidden = true;
A.titre = () => barre.getTitre();
const etatEl = barre.el.querySelector('.eb-etat');
const logo = barre.el.querySelector('.eb-logo');
if (logo) logo.addEventListener('click', (e) => { if (doitEnregistrer()) { e.preventDefault(); partir(logo.href); } });
A.paintToolButtons();

function etatBrouillon() {
  barre.setEtat('propre');
  etatEl.dataset.etat = 'brouillon';
  etatEl.querySelector('span').textContent = 'Non gardée tant que tu n’y écris rien';
  etatEl.title = 'Cette ardoise n’est pas encore dans tes ardoises. Elle y est gardée dès que tu dessines, écris ou ajoutes du contenu, ou si tu touches « Garder ».';
}
function majBarre() {
  const mode = E.mode();
  bEssai.hidden = mode !== 'aucun';
  bGarder.hidden = mode === 'aucun' || !D.brouillon;
  if (mode === 'aucun') barre.setEtat('invite_requis');
  else if (D.brouillon) etatBrouillon();
  else if (etatEl.dataset.etat === 'invite_requis' || etatEl.dataset.etat === 'brouillon') barre.setEtat(D.auto ? D.auto.etat : 'propre');
  const note = $('#moreNote');
  if (note) note.textContent = mode === 'aucun' ? 'Rien n’est enregistré : commence un essai ou connecte-toi pour garder cette ardoise.'
    : mode === 'invite' ? 'Essai sans compte : l’ardoise est gardée dans ce navigateur.' : 'L’ardoise est enregistrée dans ton compte.';
}
function surEtat(e, det) {
  det = det || {};
  if (D.brouillon && e === 'propre' && E.mode() !== 'aucun') { etatBrouillon(); return; }
  barre.setEtat(e, det);
  if (e === 'enregistre') {
    D.id = D.auto.id; D.erreurVue = '';
    if (det.nouveau) { try { history.replaceState(history.state, '', '/ardoise/?doc=' + encodeURIComponent(D.id)); } catch (x) { /* adresse inchangée */ } }
  } else if (e === 'erreur' && D.erreurVue !== det.code) {
    D.erreurVue = det.code;
    A.toast(det.code === 'trop_gros' ? 'Cette ardoise est trop lourde pour être enregistrée (plus de 1,9 Mo) : retire ou remplace une image.' : 'L’ardoise n’a pas pu être enregistrée : ' + (det.message || 'erreur inconnue'), null, 8000);
  } else if (e === 'invite_requis') {
    majBarre();
    if (!D.avertiAucun) { D.avertiAucun = true; A.toast('Pour garder cette ardoise, commence un essai sans compte ou connecte-toi.', { label: 'Commencer un essai', run: commencerEssai }, 9000); }
  }
}

/* ---------- Enregistrement ---------- */
function lire() {
  return { titre: barre.getTitre() || 'Ardoise sans titre', data: { v: 1, cur: S.cur, pages: S.pages }, resume: { pages: S.pages.length } };
}
/* Ce qui compte comme contenu pour sortir du brouillon (l'usage des fenêtres, lui, ne compte pas) */
function contenu(w) {
  const d = w.data || {};
  switch (w.type) {
    case 'text': return [d.text, d.size, d.align, d.color, d.font, d.bare];
    case 'image': return d.src ? String(d.src).length + String(d.src).slice(-24) : '';
    case 'qr': return d.url;
    case 'vote': return [d.q, (d.opts || []).map((o) => o.l)];
    case 'schedule': return d.items;
    case 'signs': return d.on;
    case 'countdown': return [d.label, d.date];
    case 'light': return d.labels;
    case 'dice': return [d.words, (d.imgs || []).length];
    case 'picker': case 'groups': return d.classId === 'liste' ? d.liste : '';
    default: return '';
  }
}
function signature() {
  return JSON.stringify(S.pages.map((p) => [p.id, p.name, p.bg, p.strokes, p.widgets.map((w) => [w.id, w.type, contenu(w)])]));
}
A.save = function () {
  if (!D.pret) return;
  if (D.brouillon) { if (signature() !== D.sig) garder(); return; }
  D.auto.signaler();
};
A.writeNow = function () { if (D.pret && !D.brouillon) return D.auto.maintenant(); };
function garder(explicite) {
  if (!D.pret) return;
  D.brouillon = false;
  majBarre();
  const p = D.auto.maintenant();
  if (explicite && p && p.then) p.then(() => { if (D.auto.etat === 'enregistre') A.toast('Ardoise gardée dans tes ardoises.'); });
  return p;
}
async function commencerEssai() {
  try { await E.compte.commencerInvite(); }
  catch (e) { A.toast(e.message || 'L’essai n’a pas pu commencer.'); return; }
  D.brouillon = false;
  majBarre();
  await D.auto.maintenant();
  A.chargerClasses();
  if (D.auto.etat === 'enregistre') A.toast('Essai commencé : l’ardoise est gardée dans ce navigateur.');
}
function doitEnregistrer() {
  return D.auto && !D.brouillon && E.mode() !== 'aucun' && (D.auto.etat === 'modifie' || D.auto.etat === 'enregistrement');
}
async function partir(url) {
  if (doitEnregistrer()) { try { await D.auto.maintenant(); } catch (e) { /* on part quand même */ } }
  location.href = url;
}

/* ---------- Menu de la barre ---------- */
async function ouvrirAutre() {
  const d = await UI.choisirDoc({ type: 'ardoise', titre: 'Ouvrir une ardoise', vide: 'Aucune ardoise gardée pour l’instant.' });
  if (d && d.id !== D.id) partir('/ardoise/?doc=' + encodeURIComponent(d.id));
}
async function dupliquer() {
  try {
    if (D.auto.etat !== 'enregistre') await D.auto.maintenant();
    const r = await E.docs.dupliquer(D.id);
    partir('/ardoise/?doc=' + encodeURIComponent(r.id));
  } catch (e) { A.toast(e.message || 'La copie n’a pas pu être faite.'); }
}
function menuItems() {
  const items = [
    { label: 'Ouvrir une autre ardoise', icone: 'ardoise', fn: ouvrirAutre },
    { label: 'Nouvelle ardoise', icone: 'plus', fn: () => partir('/ardoise/?nouveau=1') },
  ];
  if (!D.brouillon && D.id) items.push({ label: 'Dupliquer cette ardoise', icone: 'copie', fn: dupliquer });
  items.push({ label: 'Toutes mes ardoises', icone: 'logo', fn: () => partir('/#ardoises') });
  items.push('sep');
  items.push({ label: 'Exporter les pages (.json)', icone: 'telecharger', fn: () => A.exporter() });
  items.push({ label: 'Importer des pages (.json)', icone: 'importer', fn: () => { $('#importFile').value = ''; $('#importFile').click(); } });
  items.push({ label: 'Aide et raccourcis clavier', icone: 'cle', fn: () => A.help() });
  return items;
}

/* ---------- Ouverture ---------- */
function dateCourte() { const d = new Date(); return (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + A.MOIS[d.getMonth()]; }
/* réglages passés par l'adresse : &minutes=N (minuteur, 0,5 = 30 s, sans démarrer) ; &taille=N (groupes de N) */
function reglagesParam(type) {
  const nombre = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : NaN; };
  if (type === 'timer') {
    const m = nombre(P.minutes);
    if (m > 0) { const s = clamp(Math.round(m * 60), 1, 120 * 60); return { total: s, left: s, running: false, endAt: null }; }
  }
  if (type === 'groups') {
    const t = Math.round(nombre(P.taille));
    if (t > 0) return { mode: 'size', n: clamp(t, 2, 10), groups: null };
  }
  return null;
}
function ajouterWidget(type) {
  const def = A.WIDGETS[type];
  const k = Math.min(1.7, 0.6 / def.size[0], 0.78 / def.size[1]);
  const w = clamp(def.size[0] * Math.max(1, k), 0.16, 0.7), h = clamp(def.size[1] * Math.max(1, k), 0.2, 0.86);
  const over = { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
  const r = reglagesParam(type);
  if (r) over.data = Object.assign(def.init ? def.init() : {}, r);
  return A.addWidget(type, over);
}
async function demarrer() {
  try { await E.pret; } catch (e) { /* client indisponible : on reste en mode « aucun » */ }
  const prefs = A.loadPrefs() || {};
  if (['pen', 'hl', 'eraser', 'hand', 'shape'].indexOf(prefs.tool) >= 0) S.tool = prefs.tool;
  if (A.COLORS.some((c) => c.id === prefs.color)) S.color = prefs.color;
  if (prefs.width >= 0 && prefs.width <= 2) S.width = prefs.width | 0;
  if (['line', 'arrow', 'rect', 'ellipse'].indexOf(prefs.shape) >= 0) S.shape = prefs.shape;
  /* lecture du document et des classes en parallèle (l'échec éventuel est capté tout de suite) */
  const lecture = P.doc ? E.docs.lire(P.doc).then((d) => {
    if (!d || d.type !== 'ardoise') throw Object.assign(new Error('Ce document n’est pas une ardoise.'), { code: 'invalide' });
    return { doc: d };
  }).catch((e) => ({ rate: e })) : Promise.resolve({});
  await A.chargerClasses();
  if (P.classe) A.chargerClasse(P.classe);
  const lu = await lecture;
  const doc = lu.doc || null, rate = lu.rate || null;
  const wtype = P.widget ? (WPARAM[P.widget] || (A.WIDGETS[P.widget] ? P.widget : null)) : null;
  let titre;
  /* document sans contenu utilisable (data null ou incomplet, par exemple créé depuis une étape de séance) :
     il s'ouvre comme une ardoise neuve et sera enregistré sous le même identifiant à la première modification */
  const data = doc && doc.data && typeof doc.data === 'object' ? doc.data : {};
  const pagesLues = doc && Array.isArray(data.pages) ? data.pages.map((pg) => { try { return A.sanitizePage(pg); } catch (e) { return null; } }).filter(Boolean) : [];
  const vide = !!doc && !pagesLues.length;
  if (doc) { D.id = doc.id; D.brouillon = vide; }
  if (doc && !vide) {
    S.pages = pagesLues;
    S.cur = clamp(data.cur | 0, 0, pagesLues.length - 1);
    titre = doc.titre;
  } else {
    const modele = A.TEMPLATES[P.modele] ? P.modele : (wtype ? 'blanche' : 'accueil');
    S.pages = [A.TEMPLATES[modele].make()];
    if (wtype && !A.TEMPLATES[P.modele]) S.pages[0].name = A.WIDGETS[wtype].name;
    S.cur = 0;
    titre = (vide && doc.titre && doc.titre !== 'Sans titre' ? doc.titre : '') || P.titre || (wtype ? A.WIDGETS[wtype].name : modele === 'blanche' ? 'Ardoise du ' + dateCourte() : A.TEMPLATES[modele].l);
  }
  /* &classe= : utilisée par les tirages et les groupes qui n'ont pas encore de classe choisie */
  if (P.classe) S.pages.forEach((p) => p.widgets.forEach((w) => { if ((w.type === 'picker' || w.type === 'groups') && (!w.data.classId || w.data.classId === 'exemple')) w.data.classId = P.classe; }));
  barre.setTitre(titre);
  A.paintToolButtons();
  A.boardInit();
  A.mountWidgets();
  A.renderPageBar();
  if (wtype && (!doc || vide)) ajouterWidget(wtype);
  D.auto = E.autoSave({ type: 'ardoise', id: D.id, lire, surEtat });
  D.sig = signature();
  D.pret = true;
  majBarre();
  if (!D.brouillon && E.mode() !== 'aucun') barre.setEtat('enregistre');
  if (rate) {
    const msg = rate.code === 'non_connecte' ? 'Connecte-toi ou commence un essai pour ouvrir cette ardoise. Une nouvelle ardoise est ouverte en attendant.'
      : rate.code === 'introuvable' ? 'Cette ardoise est introuvable (supprimée ?). Une nouvelle ardoise est ouverte.'
      : 'L’ardoise n’a pas pu être ouverte : ' + rate.message;
    A.toast(msg, null, 9000);
    try { history.replaceState(history.state, '', '/ardoise/'); } catch (e) { /* adresse inchangée */ }
  }
  else if (D.brouillon && E.mode() !== 'aucun' && window.matchMedia('(max-width: 1100px)').matches) {
    A.toast('Cette ardoise n’est gardée que si tu y écris, dessines ou touches « Garder ».', null, 6000);
  }
  if (P.presenter) A.present(true, true);
}

E.on('docs', (ev) => {
  if (!ev || ev.type === 'ardoise') return;
  if (ev.type === 'classe' || ['supprime', 'restaure', 'efface', 'import'].indexOf(ev.action) >= 0) { A.oublierClasse(ev.id); A.chargerClasses(); }
