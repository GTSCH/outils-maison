<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · L’Établi</title>
<link rel="stylesheet" href="/css/polices.css">
<link rel="stylesheet" href="/css/etabli.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
  .eb-barre { position: static; }
  main { display: grid; place-items: center; padding: 32px 16px 64px; }
  .bloc { width: min(560px, 100%); display: grid; gap: 22px; }
  .code404 { font: 700 15px/1 var(--font-display); letter-spacing: .08em; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; }
  .code404::before { content: ""; width: 28px; height: 4px; border-radius: 2px; background: var(--mark); }
  h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 700; }
  .texte { font-size: 18px; color: var(--muted); max-width: 46ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .rejoindre { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
  .rejoindre label { font-weight: 700; }
  .ligne { display: flex; gap: 8px; flex-wrap: wrap; }
  .ligne .input { flex: 1 1 140px; width: auto; min-width: 0; font: 600 22px/1 var(--font-display); letter-spacing: .14em; text-align: center; }
  .erreur { color: var(--bad); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<header class="eb-barre">
  <a class="eb-logo" href="/" title="Retour au pupitre">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="13" width="19" height="3.2" rx="1"/><path d="M5 16.2V21M19 16.2V21"/><path d="M7.5 13l7-9.2 2.3 1.8-7 9.2"/><path d="M14.5 3.8l2.3 1.8"/></svg>
    <span>L’Établi</span>
  </a>
</header>
<main>
  <div class="bloc">
    <span class="code404">ERREUR 404</span>
    <h1>Cette page est introuvable</h1>
    <p class="texte">L’adresse ne mène nulle part : elle a peut-être été mal recopiée, ou la page a été déplacée.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour au pupitre</a>
    </div>
    <form class="rejoindre" id="rejoindre" novalidate>
      <label for="code">Tu cherches un quiz en direct ? Entre le code à six chiffres.</label>
      <div class="ligne">
        <input class="input" id="code" name="code" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123456" aria-describedby="erreur">
        <button class="btn" type="submit">Rejoindre</button>
      </div>
      <p class="erreur" id="erreur" aria-live="polite"></p>
    </form>
  </div>
</main>
<footer style="padding: 0 16px 24px; text-align: center; font-size: 14px; color: var(--muted);"><a href="/confidentialite" style="color: inherit;">Protection des données</a></footer>
<script>
  (function () {
    var f = document.getElementById('rejoindre');
    var champ = document.getElementById('code');
    var msg = document.getElementById('erreur');
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var code = champ.value.replace(/\D/g, '');
      if (code.length !== 6) { msg.textContent = 'Le code compte six chiffres.'; champ.focus(); return; }
      location.href = '/' + code;
    });
  })();
</script>
</body>
</html>
