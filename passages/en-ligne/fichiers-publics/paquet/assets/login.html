<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Bibliothèque</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login" id="f">
    <h1>Bibliothèque</h1>
    <p>Bibliothèque de recherche privée. Entre ton mot de passe pour continuer.</p>
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" autofocus required>
    <button class="btn primary" type="submit">Se connecter</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (!r.ok) return (msg.textContent = (await r.json().catch(() => ({}))).error || 'Connexion impossible.');
  if (location.pathname === '/') location.reload();
  else location.href = '/' + location.hash;
});
</script>
</body>
</html>
