<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Main levée</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/polices.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .entete { padding-top: 10px; padding-bottom: 10px; }
  .entete .marque b { font-size: 19px; }
  .entete .marque::before { height: 28px; }
  .entete .logo { height: 18px; }
  #titre { font-size: 15px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; width: min(100%, 640px); margin: 0 auto; padding: 22px var(--gouttiere) 40px; }
  .num { font-family: var(--font-din); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .question { font-size: clamp(22px, 5.6vw, 28px); margin-bottom: 18px; white-space: pre-wrap; }
  .choix { display: grid; gap: 10px; }
  .choix button {
    appearance: none; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    font: inherit; font-size: 19px; font-weight: 700; color: var(--encre); background: var(--blanc);
    border: 2px solid var(--rd-50); border-radius: 0; padding: 12px 14px; min-height: 64px; cursor: pointer;
  }
  .choix button .lettre { font-size: 18px; }
  .choix button .txt { flex: 1; }
  .choix button .tag { font-family: var(--font-din); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .choix button[aria-pressed=true] { border: 4px solid var(--rouge); background: var(--rouge-25); padding: 10px 12px; }
  .choix button:disabled { cursor: default; }
  .choix button.bonne { border-color: var(--fp); background: var(--fp-25); }
  .choix button.bonne .lettre { background: var(--fp); }
  .choix button.faux { border-color: var(--rd); }
  .choix button.faux .lettre { background: var(--rd); }
  .echelle { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .echelle button {
    appearance: none; font-family: var(--font-din); font-weight: 700; font-size: 24px; min-height: 64px;
    border: 2px solid var(--rd-50); background: var(--blanc); color: var(--encre); border-radius: 0; cursor: pointer; padding: 0;
  }
  .echelle button[aria-pressed=true] { background: var(--rouge); border-color: var(--rouge); color: var(--blanc); }
  .echelle-legende { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; margin-top: 6px; }
  .saisie { display: grid; gap: 10px; }
  .saisie input, .saisie textarea { font-size: 20px; }
  .etat-envoi { margin-top: 16px; padding: 12px 14px; font-weight: 700; }
  .etat-envoi.ok { background: var(--fp-25); }
  .retour { margin: 18px 0; padding: 16px; font-family: var(--font-din); font-weight: 700; font-size: 22px; color: var(--blanc); }
  .retour.juste { background: var(--fp); }
  .retour.faux { background: var(--encre); }
  .retour.neutre { background: var(--fc); }
  .centre { text-align: center; padding-top: 8vh; }
  .attente-anim { display: inline-flex; gap: 10px; margin: 26px 0; }
  .attente-anim i { width: 16px; height: 16px; background: var(--rouge); animation: saut 1.2s infinite ease-in-out; }
  .attente-anim i:nth-child(2) { animation-delay: .15s; }
  .attente-anim i:nth-child(3) { animation-delay: .3s; }
  @keyframes saut { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .attente-anim i { animation: none; opacity: .7; } }
  .bandeau { position: sticky; top: 0; z-index: 30; background: var(--encre); color: var(--blanc); padding: 8px var(--gouttiere); font-size: 15px; text-align: center; }
  .resultats { margin-top: 22px; font-size: 17px; }
  .resultats h3 { font-size: 18px; }
  .res-echelle { height: 140px; }
  .res-nuage { font-size: 16px; }
  .score { font-family: var(--font-din); font-weight: 700; font-size: 56px; line-height: 1; margin: 12px 0; }
  .vie-privee { font-size: 14px; margin-top: 40px; }
</style>
</head>
<body>
<div class="bandeau" id="bandeau" hidden>Connexion perdue. Reconnexion en cours…</div>
<header class="entete">
  <a class="marque" href="/"><b>Main levée</b><span id="titre"></span></a>
  <div class="droite" id="logo"></div>
</header>
<main id="scene" aria-live="polite">
  <div class="centre"><div class="attente-anim" aria-hidden="true"><i></i><i></i><i></i></div><p>Connexion…</p></div>
</main>
<footer style="padding: 10px var(--gouttiere) 16px; text-align: center; font-size: 14px;"><a href="/confidentialite">Protection des données</a></footer>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/commun.js"></script>
<script src="/js/resultats.js"></script>
<script>
(() => {
  const { h, $, LETTRES } = ML;
  $("#logo").innerHTML = ML.LOGO;
  const scene = $("#scene");
  const code = ML.codeDansAdresse();
  if (!code) { location.replace("/"); return; }

  const kPid = "mainlevee.p." + code, kPseudo = "mainlevee.pseudo";
  let pid = ML.stock(kPid);
  if (!pid) { pid = "p" + ML.genId(15); ML.stock(kPid, pid); }
  let pseudo = ML.stock(kPseudo) || "";
  let etat = null, cx = null, brouillon = "", derniereCle = "", envoiEnCours = false;

  function vider(...enfants) { scene.replaceChildren(...enfants); }
  const vibrer = (ms) => { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(ms); };

  async function demarrer() {
    let infos;
    try { infos = await ML.api("GET", `/sessions/${code}/public`); }
    catch {
      vider(h("div", { class: "centre" },
        h("h1", {}, "Code introuvable"),
        h("p", {}, `Aucune session ne correspond au code ${ML.formatCode(code)}.`),
        h("a", { class: "btn primaire", href: "/" }, "Saisir un autre code")));
      return;
    }
    $("#titre").textContent = infos.titre;
    document.title = infos.titre + " · Main levée";
    if (infos.pseudo && !pseudo) return demanderPseudo(() => connecter());
    connecter();
  }

  function demanderPseudo(suite) {
    const champ = h("input", { type: "text", maxlength: "30", autocomplete: "given-name", value: pseudo, required: true, id: "pseudo" });
    vider(h("form", { class: "saisie", onsubmit: (e) => {
        e.preventDefault();
        const p = champ.value.trim();
        if (!p) return champ.focus();
        pseudo = p; ML.stock(kPseudo, p);
        if (cx) cx.envoyer({ t: "pseudo", pseudo: p });
        suite();
      } },
      h("h1", { class: "question" }, "Votre prénom"),
      h("p", {}, "Votre enseignant·e a demandé que les réponses portent un prénom."),
      h("label", { class: "sr", for: "pseudo" }, "Prénom"), champ,
      h("button", { class: "btn primaire grand", type: "submit" }, "Continuer")));
    champ.focus();
  }

  function connecter() {
    if (cx) return rendre();
    cx = ML.connecter(code, () => ({ t: "hello", role: "participant", pid, pseudo }), {
      onMessage: (m) => {
        if (m.t === "etat") { const avant = etat; etat = m; envoiEnCours = false; rendre(avant); }
        else if (m.t === "info") ML.toast(m.message);
        else if (m.t === "refus") vider(h("div", { class: "centre" }, h("h1", {}, "Impossible de rejoindre"), h("p", {}, m.message)));
      },
      onStatut: (s, codeFermeture) => {
        $("#bandeau").hidden = s !== "coupe";
        if (s === "refuse" && codeFermeture === 4004) vider(h("div", { class: "centre" }, h("h1", {}, "Session fermée"), h("p", {}, "Cette session a été supprimée par l'enseignant·e.")));
      },
    });
  }

  function envoyer(valeur) {
    if (!etat || !cx) return;
    if (!cx.envoyer({ t: "repondre", q: etat.index, valeur })) return ML.toast("Pas de connexion, réessayez dans un instant.", "erreur");
    envoiEnCours = true;
    vibrer(20);
  }

  function rendre(avant) {
    const e = etat;
    if (!e) return;
    if (e.pseudoRequis && !e.pseudo && !pseudo) return demanderPseudo(() => rendre());
    const cle = `${e.statut}|${e.index}|${e.revele}`;
    const nouvelleQuestion = e.statut === "question" && (!avant || avant.index !== e.index || avant.statut !== "question");
    if (cle !== derniereCle) { if (nouvelleQuestion) { brouillon = ""; vibrer(60); } derniereCle = cle; }

    if (e.statut === "attente") {
      return vider(h("div", { class: "centre" },
        h("h1", {}, "C'est parti"),
        h("p", {}, "Vous êtes connecté·e. La première question va apparaître ici."),
        h("div", { class: "attente-anim", "aria-hidden": "true" }, h("i"), h("i"), h("i")),
        e.pseudo ? h("p", { class: "petit" }, "Vous apparaissez sous le nom ", h("b", {}, e.pseudo), ".") : null,
        h("p", { class: "vie-privee muet" }, "Aucun compte, aucune adresse e-mail : votre appareil reçoit seulement un identifiant aléatoire pour cette session.")));
    }

    if (e.statut === "terminee") {
      return vider(h("div", { class: "centre" },
        h("h1", {}, "Merci pour votre participation"),
        e.score ? [h("p", {}, "Bonnes réponses"), h("p", { class: "score" }, `${e.score.justes} / ${e.score.total}`)] : null,
        h("p", { class: "muet" }, `Vous avez répondu à ${ML.pluriel(e.nbRepondu || 0, "question", "questions")}.`),
        h("a", { class: "btn", href: "/" }, "Retour à l'accueil")));
    }

    if (e.statut !== "question" || !e.question) return;
    const q = e.question;
    const ferme = !!e.ferme;
    const focusAvant = document.activeElement?.id;
    const blocs = [
      h("p", { class: "num" }, `Question ${e.index + 1} sur ${e.nb}`),
      h("h1", { class: "question" }, q.texte || "(question sans texte)"),
    ];

    if (q.type === "qcm") {
      const bonnes = e.correction?.bonnes || [];
      blocs.push(h("div", { class: "choix", role: "group", "aria-label": "Réponses" },
        q.options.map((txt, i) => {
          const mien = String(e.maReponse) === String(i);
          const cls = e.revele && bonnes.length ? (bonnes.includes(i) ? "bonne" : mien ? "faux" : "") : "";
          return h("button", { type: "button", class: cls, "aria-pressed": mien ? "true" : "false", disabled: ferme, onclick: () => envoyer(i) },
            h("span", { class: "lettre", "aria-hidden": "true" }, LETTRES[i]), h("span", { class: "txt" }, txt || "(option vide)"),
            mien ? h("span", { class: "tag" }, "Votre réponse") : null);
        })));
    } else if (q.type === "echelle") {
      const boutons = [];
      for (let v = q.min; v <= q.max; v++) {
        boutons.push(h("button", { type: "button", "aria-pressed": String(e.maReponse) === String(v) ? "true" : "false", onclick: () => envoyer(v), "aria-label": `${v} sur ${q.max}` }, String(v)));
      }
      blocs.push(h("div", { class: "echelle" }, boutons));
      const et = q.etiquettes || [];
      if (et[0] || et[1]) blocs.push(h("div", { class: "echelle-legende" }, h("span", {}, et[0] ? `${q.min} = ${et[0]}` : ""), h("span", {}, et[1] ? `${q.max} = ${et[1]}` : "")));
    } else {
      const libre = q.type === "libre";
      const champ = libre
        ? h("textarea", { id: "saisie", maxlength: "400", rows: "4", placeholder: "Votre réponse" })
        : h("input", { id: "saisie", type: "text", maxlength: "40", placeholder: "Un mot ou une courte expression", autocomplete: "off", enterkeyhint: "send" });
      champ.value = brouillon;
      champ.addEventListener("input", () => (brouillon = champ.value));
      blocs.push(h("form", { class: "saisie", onsubmit: (ev) => {
          ev.preventDefault();
          const v = champ.value.trim();
          if (!v) return champ.focus();
          envoyer(v); brouillon = ""; champ.value = "";
        } },
        h("label", { class: "sr", for: "saisie" }, "Votre réponse"), champ,
        h("button", { class: "btn primaire", type: "submit" }, e.maReponse ? "Remplacer ma réponse" : "Envoyer")));
    }

    if (e.maReponse !== null && e.maReponse !== undefined) {
      const affiche = q.type === "qcm" ? `${LETTRES[e.maReponse]} · ${q.options[e.maReponse] || ""}` : q.type === "echelle" ? e.maReponse : `« ${e.maReponse} »`;
      blocs.push(h("p", { class: "etat-envoi ok", role: "status" }, `Réponse enregistrée : ${affiche}`,
        !ferme ? h("span", { style: { fontWeight: 400 } }, ". Vous pouvez la modifier.") : ""));
    } else if (ferme) {
      blocs.push(h("p", { class: "etat-envoi" }, "Les réponses sont fermées pour cette question."));
    }

    if (e.revele) {
      if (e.correction && e.correction.juste !== null) {
        blocs.splice(2, 0, h("div", { class: "retour " + (e.correction.juste ? "juste" : "faux") }, e.correction.juste ? "Bonne réponse !" : "Ce n'était pas la bonne réponse."));
      }
      if (e.resultats && q.type !== "libre") {
        const qPourRes = q.type === "qcm" ? { ...q, options: q.options.map((t, i) => ({ texte: t, bonne: (e.correction?.bonnes || []).includes(i) })) } : q;
        blocs.push(h("div", { class: "resultats" }, h("h3", {}, `Résultats de la classe (${ML.pluriel(e.resultats.total, "réponse", "réponses")})`),
          Resultats.rendre(qPourRes, e.resultats, { tailleMax: 2.6 })));
      }
    }
    vider(...blocs);
    if (focusAvant === "saisie") $("#saisie")?.focus();
  }

  demarrer();
})();
</script>
</body>
</html>
